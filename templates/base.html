<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Simulateur de Phishing{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <div class="logo">
            <h1>🎣 Simulateur de Phishing</h1>
        </div>
        <nav class="main-nav">
            <a href="/dashboard" class="nav-link">📊 Tableau de bord</a>
            <a href="/campaign/create" class="nav-link">➕ Nouvelle campagne</a>
            <a href="/users" class="nav-link">👥 Utilisateurs</a>
        </nav>
    </div>
</header>

<main class="main-content">
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</main>

<footer class="main-footer">
    <p>&copy; 2026 Simulateur de Phishing - Outil de sensibilisation à la sécurité</p>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}

</body>
</html>
